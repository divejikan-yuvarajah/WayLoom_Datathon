version: 1
phase: 30
official_requirement: Brief write-up of data preparation, label construction, data cleaning, feature engineering,
  and rationale.
source_configs:
- configs/dataset_manifest.yaml
- configs/task1_features.yaml
- configs/task1_validation.yaml
- configs/task1_final_models.yaml
- configs/task1_inference.yaml
- configs/task2a_history.yaml
- configs/task2a_features.yaml
- configs/task2a_validation.yaml
- configs/task2a_final_models.yaml
- configs/task2a_inference.yaml
- configs/task2b_scenario.yaml
- configs/task2b_trip_time.yaml
- configs/task2b_priority.yaml
- configs/task2b_optimizer.yaml
- configs/task2b_validation.yaml
- configs/task2b_output.yaml
inputs:
- logical_name: deliveries_train
  filename: deliveries_train.csv
  category: training
  grain: One row per order delivery attempt
  key_fields:
  - delivery_id
  used_by:
  - Task 1 labels/features
  - Task 2A demand history
- logical_name: route_legs_train
  filename: route_legs_train.csv
  category: training
  grain: One row per route leg journey segment
  key_fields:
  - leg_id
  used_by:
  - Task 1 historical labels and planned route context
- logical_name: task1_test_inputs
  filename: task1_test_inputs.csv
  category: test
  grain: One row per planned delivery in Task 1 test horizon
  key_fields:
  - delivery_id
  used_by:
  - Task 1 inference
  - Task 2A demand history
- logical_name: route_legs_test
  filename: route_legs_test.csv
  category: test
  grain: One row per planned route leg in Task 1 test horizon
  key_fields:
  - leg_id
  used_by:
  - Task 1 planned route context
- logical_name: task2a_test_inputs
  filename: task2a_test_inputs.csv
  category: test
  grain: One row per depot, brand, and future forecast week
  key_fields:
  - row_id
  used_by:
  - Task 2A forecast identity and horizon grid
- logical_name: task2b_peak_day_scenarios
  filename: task2b_peak_day_scenarios.csv
  category: test
  grain: One row per customer order in peak day scenarios
  key_fields:
  - order_ref
  used_by:
  - Task 2B scenario orders
- logical_name: task2b_peak_day_fleet
  filename: task2b_peak_day_fleet.csv
  category: test
  grain: One row per fleet vehicle available in peak day scenarios
  key_fields:
  - scenario
  - vehicle_id
  used_by:
  - Task 2B scenario availability
- logical_name: outlets
  filename: outlets.csv
  category: general
  grain: One row per retail outlet
  key_fields:
  - outlet_id
  used_by:
  - Task 1 outlet, dock, access and window context
- logical_name: vehicles
  filename: vehicles.csv
  category: general
  grain: One row per fleet vehicle
  key_fields:
  - vehicle_id
  used_by:
  - Task 1 vehicle context
  - Task 2B capability and capacity
- logical_name: calendar
  filename: calendar.csv
  category: general
  grain: One row per calendar date
  key_fields:
  - date
  used_by:
  - Task 1 calendar context
  - Task 2A ISO weeks and target-week context
- logical_name: district_travel
  filename: district_travel.csv
  category: general
  grain: One row per depot-to-district corridor
  key_fields:
  - district
  - depot
  used_by:
  - Task 1 geography context
  - Task 2B trip-time lookup
- logical_name: service_allowance
  filename: service_allowance.csv
  category: general
  grain: One row per brand and dock type combination
  key_fields:
  - brand
  - dock_type
  used_by:
  - Task 1 allowance context
  - Task 2B handling-time lookup
- logical_name: submission_task1
  filename: submission_task1.csv
  category: templates
  grain: One row per Task 1 test delivery
  key_fields:
  - delivery_id
  used_by:
  - Task 1 official output identity
- logical_name: submission_task2a
  filename: submission_task2a.csv
  category: templates
  grain: One row per Task 2A forecast row
  key_fields:
  - row_id
  used_by:
  - Task 2A official output identity
- logical_name: submission_task2b
  filename: submission_task2b.csv
  category: templates
  grain: One row per Task 2B order_ref in scenario S1
  key_fields:
  - order_ref
  used_by:
  - Task 2B official output identity
joins:
- task: Task 1 train
  left: deliveries_train
  right: route_legs_train
  keys: (route_id, seq_in_route) -> (route_id, seq)
  cardinality: one_to_one
- task: Task 1 test
  left: task1_test_inputs
  right: route_legs_test
  keys: (route_id, seq_in_route) -> (route_id, seq)
  cardinality: one_to_one
- task: Task 1
  left: orders
  right: outlets
  keys: outlet_id
  cardinality: many_to_one
- task: Task 1
  left: orders
  right: vehicles
  keys: vehicle_id
  cardinality: many_to_one
- task: Task 1
  left: orders
  right: calendar
  keys: date
  cardinality: many_to_one
- task: Task 1
  left: orders
  right: district_travel
  keys: (district, depot)
  cardinality: many_to_one
- task: Task 1 and Task 2B
  left: orders
  right: service_allowance
  keys: (brand, dock_type)
  cardinality: many_to_one
- task: Task 2A
  left: requested orders
  right: calendar
  keys: order_date -> date
  cardinality: many_to_one
- task: Task 2B
  left: scenario fleet
  right: vehicles
  keys: vehicle_id
  cardinality: one_to_one
- task: Task 2B
  left: trip
  right: district_travel
  keys: (depot, district)
  cardinality: many_to_one
- task: Task 2B output
  left: official template
  right: allocation
  keys: order_ref
  cardinality: one_to_one
task1_labels:
  eligible_dispatch_statuses:
  - attempted
  - deferred
  excluded_dispatch_status: not_run
  service_start: max(arrival_time_dt, window_open_dt)
  service_minutes: (leave_outlet_time_dt - service_start_dt) / 60
  late_flag: 1 only when arrival_time_dt > window_close_dt
  arrival_at_close_is_late: false
  early_wait_is_service: false
  midnight_handling: deterministic route-sequence rollover with source-duration consistency check
cleaning:
  policy: fail_closed_for_schema_identity_reference_and_impossible_values
  row_dropping: no generic invalid-row dropping
  missing_model_features: model-specific handling only after contract validation
  official_identity: preserve exact keys and required template order
task1_features:
  profile: safe_core_plus_history
  groups:
  - planned timing and delivery-window context
  - planned travel and distance
  - order size and cargo ratios
  - outlet brand district depot dock and access context
  - vehicle capability capacity and planned utilization
  - route position workload and prior planned stops
  - calendar context and service allowance
  - chronology-safe historical aggregates
  road_context_enabled: false
  traffic_context_enabled: false
task1_leakage:
  forbidden_direct_predictors:
  - actual_depart_time
  - actual_travel_duration_min
  - arrival_time
  - leave_outlet_time
  - service_minutes
  - late_flag
  historical_fit_scope: historical_training_population_only
  test_rows_update_history: false
task1_validation:
  final_holdout_strategy:
    strategy: last_calendar_days
    calendar_days: 42
    same_date_atomic: true
  expanding_cv:
    n_folds: 4
    validation_calendar_days: 42
    gap_calendar_days: 0
    same_date_atomic: true
    require_expanding_train: true
    minimum_training_calendar_days: 180
  fit_dependent_policy:
    validation_policy: fit_on_train_transform_validation
    allow_validation_targets_during_transform: false
  service_primary_metric: mae
  lateness_primary_metric: log_loss
task1_models:
  service_family: catboost
  service_config_id: catboost_regression_default
  service_postprocessing: fail_on_negative_prediction
  lateness_family: catboost
  lateness_config_id: catboost_classifier_default
  calibration: raw
  calibration_protocol: chronological_oof
task2a_history:
  sources:
  - deliveries_train.csv
  - task1_test_inputs.csv
  - calendar.csv
  order_key: delivery_id
  requested_date_column: order_date
  retained_statuses:
  - attempted
  - deferred
  - not_run
  series_keys:
  - depot
  - brand
  week_keys:
  - iso_year
  - iso_week
  calendar_iso_source_of_truth: true
  zero_fill_policy: confirmed_complete_interior_gaps_only
task2a_features:
  strategy: direct_global_table
  horizons:
  - 1
  - 10
  lags:
  - 1
  - 2
  - 4
  - 13
  - 52
  rolling_windows:
  - 4
  - 8
  - 13
  trend_windows:
  - 4
  - 13
  target_week_calendar_required: true
  missing_history_policy: keep_missing
task2a_validation:
  strategy: rolling_origin
  n_backtests: 4
  validation_horizon_weeks: 10
  minimum_training_weeks: 52
  require_target_week_on_or_before_origin: true
task2a_models:
  state: FROZEN
  final_strategy: direct_global_table_separate_target_ensembles
  total_family: catboost_lightgbm_ensemble
  total_config_id: ensemble_cb_lgb_total_equal_v1
  total_weights:
  - 0.5
  - 0.5
  chilled_family: catboost_lightgbm_ensemble
  chilled_config_id: ensemble_cb_lgb_chilled_equal_v1
  chilled_weights:
  - 0.5
  - 0.5
  chilled_scope: Fresh_only
task2a_postprocessing:
  clip_negative: true
  enforce_chilled_le_total: true
  rounding: none
  style_chilled_zero: true
  tech_chilled_zero: true
  preserve_template_order: true
task2b_inputs:
  scenario:
    expected_id: S1
    expected_depot: Peliyagoda
  available_status: available
  workshop_status: in_workshop
  allocation_key: order_ref
task2b_compatibility:
  pair_checks:
  - refrigeration
  - van_only access
  - home depot
  - single-order weight
  - single-order volume
  trip_group_checks:
  - same brand
  - same district
  - whole order
  - weight capacity
  - volume capacity
task2b_trip_time:
  formula: depot_to_district_freeflow_min + inter_stop_freeflow_min * (num_orders - 1) + sum(service_allowance_min)
  service_allowance_keys:
  - brand
  - dock_type
  include_return_leg: false
  rounding: none
  fresh_budget_min: 270
  style_tech_budget_min: 480
task2b_hard_rules:
- same brand and district per trip
- chilled requires reefer
- van_only requires van
- vehicle home depot must match
- whole order with no split
- both weight and volume capacity
- at most two trips plus Fresh and Style+Tech daily time budgets
task2b_priority:
  origin: WayLoom engineering policy; not organizer priority
  strategy: lexicographic
  objective_levels:
  - - served_order_count
    - maximize
  - - served_previous_deferred_count
    - maximize
  - - served_waiting_days_sum
    - maximize
  - - served_low_flexibility_count
    - maximize
  - - served_fresh_chilled_count
    - maximize
  - - served_fresh_count
    - maximize
  - - avoidable_reefer_van_assignment_count
    - minimize
  - - avoidable_reefer_assignment_count
    - minimize
  - - avoidable_van_assignment_count
    - minimize
  hard_rule_override: false
task2b_validation:
  solver: OR-Tools CP-SAT
  solver_engine: ortools_cp_sat
  deterministic_seed: 42
  deterministic_workers: 1
  require_all_objective_stages_optimal: true
  independent_validator: solver-neutral feasibility audit
  official_checker: feasibility only; does not prove optimality
  require_frozen_hash: true
  official_export_columns:
  - scenario
  - order_ref
  - outlet_id
  - decision
  - vehicle_id
  - trip_id
outputs:
  task1:
  - delivery_id
  - pred_service_min
  - pred_late_prob
  task2a:
  - row_id
  - pred_total_volume_m3
  - pred_chilled_volume_m3
  task2b:
  - scenario
  - order_ref
  - outlet_id
  - decision
  - vehicle_id
  - trip_id
privacy:
  contains_private_rows: false
  contains_real_identifiers: false
  contains_absolute_user_paths: false
  reads_private_data: false
task_completeness:
  DT-379:
  - 2. Input datasets
  DT-380:
  - 4.1 joins
  - 5.1 demand-history construction
  - 6.2 compatibility preparation
  DT-381:
  - 4.2 label construction
  DT-382:
  - 3. Shared data preparation and quality controls
  - 4.3 cleaning
  - 5.3 cleaning
  DT-383:
  - 4.4 feature engineering
  - 5.4 forecasting features
  - 6.2 compatibility preparation
  DT-384:
  - 4.5 leakage prevention
  - 5.5 leakage prevention
  DT-385:
  - 4.6 validation
  - 5.6 rolling validation
  - 6.6 optimizer / independent validation / official export
  DT-386:
  - 4.7 final model rationale
  - 5.7 final forecasting methodology and model rationale
  DT-387:
  - 5.1 demand-history construction
  - 5.7 final forecasting methodology and model rationale
  DT-388:
  - 6. Task 2B - peak-day allocation preparation
