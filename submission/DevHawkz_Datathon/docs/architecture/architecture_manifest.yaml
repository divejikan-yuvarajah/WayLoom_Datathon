version: 1
phase: 29
status: final
contains_private_data: false
source_commit: 44f791e0adc3
source_configs:
- configs/task1_final_models.yaml
- configs/task2a_final_models.yaml
- configs/task2a_features.yaml
- configs/task2b_optimizer.yaml
- configs/task2b_priority.yaml
task1:
  feature_profile: safe_core_plus_history
  service_model_family: catboost
  service_config_id: catboost_regression_default
  late_model_family: catboost
  late_config_id: catboost_classifier_default
  late_calibration: raw
  late_calibration_protocol: chronological_oof
  service_postprocessing: fail_on_negative_prediction
  prediction_time_actual_fields_forbidden:
  - actual_depart_time
  - actual_travel_duration_min
  - arrival_time
  - leave_outlet_time
  output_columns:
  - delivery_id
  - pred_service_min
  - pred_late_prob
task2a:
  forecast_horizon_weeks: 10
  feature_strategy: direct_global_table
  final_strategy: direct_global_table_separate_target_ensembles
  total_model_family: catboost_lightgbm_ensemble
  total_config_id: ensemble_cb_lgb_total_equal_v1
  total_component_count: 2
  chilled_model_family_or_strategy: catboost_lightgbm_ensemble
  chilled_config_id: ensemble_cb_lgb_chilled_equal_v1
  chilled_scope: Fresh_only; Style_and_Tech_structural_zero
  chilled_component_count: 2
  history_sources:
  - deliveries_train
  - task1_test_inputs
  postprocessing:
  - clip_negative
  - enforce_chilled_le_total
  - Style_chilled_zero
  - Tech_chilled_zero
  output_columns:
  - row_id
  - pred_total_volume_m3
  - pred_chilled_volume_m3
task2b:
  solver: OR-Tools CP-SAT
  solver_engine: ortools_cp_sat
  deterministic_workers: 1
  require_optimal_objective_stages_for_freeze: true
  max_trips_per_vehicle: 2
  fresh_minutes_limit: 270
  style_tech_minutes_limit: 480
  include_return_leg: false
  policy_name: WayLoom lexicographic feasibility-respecting policy
  policy_origin: WayLoom engineering policy; not organizer priority
  objective_levels:
  - MAXIMIZE served_order_count
  - MAXIMIZE served_previous_deferred_count
  - MAXIMIZE served_waiting_days_sum
  - MAXIMIZE served_low_flexibility_count
  - MAXIMIZE served_fresh_chilled_count
  - MAXIMIZE served_fresh_count
  - MINIMIZE avoidable_reefer_van_assignment_count
  - MINIMIZE avoidable_reefer_assignment_count
  - MINIMIZE avoidable_van_assignment_count
  output_columns:
  - scenario
  - order_ref
  - outlet_id
  - decision
  - vehicle_id
  - trip_id
deployment:
  status: proposed
  default_execution: private_local_batch
  external_proprietary_modelling_api: false
  hackathon_integration_required: false
  phase28_integration_contract: optional_synthetic_or_internal
diagrams:
- diagram_id: high_level_datathon
  title: High-level WayLoom Datathon architecture
  status: final
  contains_private_data: false
- diagram_id: task1_pipeline
  title: Task 1 service-time and lateness pipeline
  status: final
  contains_private_data: false
- diagram_id: task2a_forecasting
  title: Task 2A ten-week demand forecasting pipeline
  status: final
  contains_private_data: false
- diagram_id: task2b_optimization
  title: Task 2B peak-day optimization pipeline
  status: final
  contains_private_data: false
- diagram_id: proposed_deployment
  title: Proposed private batch deployment
  status: final
  contains_private_data: false
