version: 1

series_keys: [depot, brand]
week:
  date_column: week_start_date
  iso_year_column: iso_year
  iso_week_column: iso_week

validation:
  reuse_phase14_plan: true
  require_exact_10_week_windows: true

baseline_families:
  last_week: {enabled: true}
  recent_mean: {enabled: true, window_weeks: 4, minimum_history_weeks: 4}
  same_week_last_year: {enabled: true, lookup: exact_prior_iso_year_same_iso_week, unavailable_fallback: recent_mean}
  seasonal_recent_weighted: {enabled: true, recent_weight: 0.50, seasonal_weight: 0.50, seasonal_unavailable_fallback: recent_mean}

total_target: {column: total_volume_m3}
chilled_target:
  column: chilled_volume_m3
  fresh_brand: Fresh
  structural_zero_brands: [Style, Tech]

postprocessing: {clip_negative: false, enforce_chilled_le_total: false}
selection:
  total_primary_metric: mae
  chilled_primary_metric: mae
  tie_break_order: [rmse, p90_absolute_error, backtest_mae_std, simplicity]
privacy: {output_dir: reports/private/phase15_task2a_baselines}
