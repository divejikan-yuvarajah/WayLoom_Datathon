version: 1
validation: {reuse_phase14_plan: true, allow_new_splits: false}
feature_profile:
  use_phase13_registry: true
  include_prediction_time_safe_only: true
  exclude_metadata_columns: true
  exclude_target_columns: true
catboost:
  enabled: true
  total: {candidate_id: catboost_total_v1, loss_function: MAE, eval_metric: MAE, iterations: 2000, learning_rate: 0.03, depth: 6, l2_leaf_reg: 5.0, random_seed: 42, early_stopping_rounds: 100, allow_writing_files: false, verbose: false}
  chilled: {candidate_id: catboost_chilled_v1, loss_function: MAE, eval_metric: MAE, iterations: 2000, learning_rate: 0.03, depth: 6, l2_leaf_reg: 5.0, random_seed: 42, early_stopping_rounds: 100, allow_writing_files: false, verbose: false}
lightgbm:
  enabled: true
  total: {candidate_id: lightgbm_total_v1, objective: regression_l1, metric: l1, n_estimators: 2000, learning_rate: 0.03, num_leaves: 31, min_child_samples: 20, reg_lambda: 1.0, random_state: 42, n_jobs: 1, early_stopping_rounds: 100}
  chilled: {candidate_id: lightgbm_chilled_v1, objective: regression_l1, metric: l1, n_estimators: 2000, learning_rate: 0.03, num_leaves: 31, min_child_samples: 20, reg_lambda: 1.0, random_state: 42, n_jobs: 1, early_stopping_rounds: 100}
ensembles:
  catboost_lightgbm_equal_weight: {enabled: true, weight_catboost: 0.5, weight_lightgbm: 0.5}
  advanced_reference_equal_weight: {enabled: true, weight_advanced: 0.5, weight_reference_baseline: 0.5}
selection:
  primary_metric: mae
  lower_is_better: true
  relative_tie_tolerance_pct: 0.5
  prefer_simpler_within_tolerance: true
  tie_breakers: [rmse, p90_absolute_error, backtest_mae_std, simplicity]
final_iteration_policy: {method: median_best_iteration, minimum_iteration: 1}
prediction_policy: {evaluate_raw_predictions: true, clip_negative_in_phase16: false, enforce_chilled_le_total_in_phase16: false}
artifacts: {private_output_dir: reports/private/phase16_task2a_advanced}
