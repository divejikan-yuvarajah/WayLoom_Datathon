metrics:
  - id: M-T1-SERVICE-MAE
    task: DT-464
    target: Task 1 service time
    metric: MAE
    formula: mean(abs(predicted_service_minutes - actual_service_minutes))
    unit: minutes
    split: chronological validation and final 42-day holdout
    source: configs/task1_validation.yaml
    provenance: REPO_VERIFIED
    audience: internal_definition_only
    value: NOT_AVAILABLE
  - id: M-T1-SERVICE-RMSE
    task: DT-464
    target: Task 1 service time
    metric: RMSE
    formula: sqrt(mean((predicted_service_minutes - actual_service_minutes)^2))
    unit: minutes
    split: chronological validation and final 42-day holdout
    source: configs/task1_validation.yaml
    provenance: REPO_VERIFIED
    audience: internal_definition_only
    value: NOT_AVAILABLE
  - id: M-T1-LATE-LOGLOSS
    task: DT-464
    target: Task 1 late probability
    metric: log_loss
    formula: binary cross-entropy for int(arrival_dt > window_close_dt)
    unit: unitless
    split: chronological validation and final 42-day holdout
    source: configs/task1_validation.yaml
    provenance: REPO_VERIFIED
    audience: internal_definition_only
    value: NOT_AVAILABLE
  - id: M-T1-LATE-BRIER
    task: DT-464
    target: Task 1 late probability
    metric: Brier score
    formula: mean((predicted_late_probability - late_flag)^2)
    unit: unitless
    split: chronological validation and final 42-day holdout
    source: configs/task1_validation.yaml
    provenance: REPO_VERIFIED
    audience: internal_definition_only
    value: NOT_AVAILABLE
  - id: M-T2A-TOTAL-MAE
    task: DT-468
    target: Task 2A total volume
    metric: pooled MAE
    formula: mean(abs(predicted_total_m3 - actual_total_m3))
    unit: m3
    split: latest four eligible rolling origins, complete horizons 1-10
    source: docs/task2a_validation_spec.md
    provenance: REPO_VERIFIED
    audience: internal_definition_only
    value: NOT_AVAILABLE
  - id: M-T2A-CHILLED-MAE
    task: DT-468
    target: Task 2A Fresh chilled volume
    metric: pooled Fresh-only MAE
    formula: mean(abs(predicted_chilled_m3 - actual_chilled_m3)) for Fresh only
    unit: m3
    split: latest four eligible rolling origins, complete horizons 1-10
    source: docs/task2a_validation_spec.md
    provenance: REPO_VERIFIED
    audience: internal_definition_only
    value: NOT_AVAILABLE

