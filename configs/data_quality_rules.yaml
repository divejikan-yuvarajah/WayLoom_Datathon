version: 1

severity:
  hard_fail: BLOCKER
  warning: WARNING
  expected: EXPECTED
  pass: PASS
  not_applicable: NOT_APPLICABLE

official_counts:
  outlets: 120
  vehicles: 60

official_enums:
  brand: [Fresh, Style, Tech]
  dispatch_status: [attempted, deferred, not_run]
  temp_requirement: [chilled, ambient]
  depot: [Peliyagoda, Kandy]
  dock_type: [rear_dock, street, mall_bay]
  parking_constraint: [normal, van_only, mall_dock]
  vehicle_type: [truck, van]
  vehicle_temp: [reefer, ambient]
  road_class: [urban, suburban, highway, hill]
  task2b_scenario: [S1]
  task2b_vehicle_status: [available, in_workshop]

binary_columns:
  - monsoon
  - is_weekend
  - is_payday
  - is_holiday
  - is_operating
  - deferred_yesterday

bounded_numeric:
  festival_ramp:
    min: 0
    max: 1
  dow:
    min: 0
    max: 6

nonnegative_numeric_columns:
  - order_units
  - order_weight_kg
  - order_volume_m3
  - distance_km
  - planned_travel_duration_min
  - actual_travel_duration_min
  - service_allowance_min
  - depot_to_district_km
  - depot_to_district_freeflow_min
  - inter_stop_km
  - inter_stop_freeflow_min
  - days_since_last_served

strictly_positive_when_present:
  - weight_cap_kg
  - volume_cap_m3
  - km_per_l
  - weekly_fuel_quota_l
  - free_flow_kmh

required_columns:
  deliveries_train.csv:
    - delivery_id
    - order_date
    - dispatch_status
    - outlet_id
    - brand
    - district
    - depot
    - temp_requirement
    - order_units
    - order_weight_kg
    - order_volume_m3
    - route_id
    - seq_in_route
    - vehicle_id
    - vehicle_type
    - vehicle_temp
    - planned_arrival_time
    - window_open_time
    - window_close_time
  route_legs_train.csv:
    - leg_id
    - date
    - route_id
    - seq
    - depot
    - vehicle_id
    - vehicle_type
    - vehicle_temp
    - brand
    - district
    - to_outlet
    - distance_km
    - planned_depart_time
    - planned_travel_duration_min
    - planned_arrival_time
    - actual_depart_time
    - actual_travel_duration_min
    - arrival_time
    - leave_outlet_time
    - monsoon
    - dow
  task1_test_inputs.csv:
    - delivery_id
    - order_date
    - dispatch_date
    - dispatch_status
    - outlet_id
    - brand
    - district
    - depot
    - temp_requirement
    - order_units
    - order_weight_kg
    - order_volume_m3
    - route_id
    - seq_in_route
    - vehicle_id
    - vehicle_type
    - vehicle_temp
    - planned_arrival_time
    - window_open_time
    - window_close_time
  route_legs_test.csv:
    - leg_id
    - date
    - route_id
    - seq
    - depot
    - vehicle_id
    - vehicle_type
    - vehicle_temp
    - brand
    - district
    - to_outlet
    - distance_km
    - planned_depart_time
    - planned_travel_duration_min
    - planned_arrival_time
    - monsoon
    - dow
  task2a_test_inputs.csv:
    - row_id
    - depot
    - brand
    - iso_year
    - iso_week
  task2b_peak_day_scenarios.csv:
    - scenario
    - order_ref
    - outlet_id
    - brand
    - district
    - depot
    - dock_type
    - parking_constraint
    - window_open_time
    - window_close_time
