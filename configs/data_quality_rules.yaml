    deliveries_train.csv: outlet_id
    task1_test_inputs.csv: outlet_id
    route_legs_train.csv: to_outlet
    route_legs_test.csv: to_outlet
    task2b_peak_day_scenarios.csv: outlet_id
  vehicle_references:
    deliveries_train.csv: vehicle_id
    task1_test_inputs.csv: vehicle_id
    route_legs_train.csv: vehicle_id
    route_legs_test.csv: vehicle_id
    task2b_peak_day_fleet.csv: vehicle_id

reference_attribute_checks:
  outlets:
    - brand
    - district
    - depot
    - window_open_time
    - window_close_time
    - dock_type
    - parking_constraint
    - mall_window
  vehicles:
    - type
    - temp
    - depot

coverage:
  road_conditions:
    preferred_join_columns: [date, district]
    optional: true
  traffic_speed:
    candidate_join_columns: [district, monsoon, dow]
    optional: true

private_report_dir: reports/private/phase03_data_quality
