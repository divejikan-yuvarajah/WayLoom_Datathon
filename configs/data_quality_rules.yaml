official_keys:
  deliveries_train.csv:
    - [delivery_id]
  task1_test_inputs.csv:
    - [delivery_id]
  route_legs_train.csv:
    - [leg_id]
    - [route_id, seq]
  route_legs_test.csv:
    - [leg_id]
