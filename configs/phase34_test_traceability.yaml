tasks:
  DT-438:
    requirement: Create a deterministic, CI-safe pytest suite with explicit Phase 34 traceability.
    coverage:
      positive: The canonical manifest loads and exposes exactly all thirteen master tasks.
      negative: Missing tasks and empty node mappings are rejected by the manifest contract test.
      boundary: Every mapped node must resolve to a real pytest function without importing private data.
    nodes:
      - tests/test_phase34_traceability.py::test_phase34_manifest_has_exact_master_inventory
      - tests/test_phase34_traceability.py::test_malformed_traceability_is_rejected
      - tests/test_phase34_traceability.py::test_mapped_nodes_exist_and_are_synthetic_only
      - tests/test_phase34_traceability.py::test_traceability_manifest_is_deterministic
      - tests/test_phase34_traceability.py::test_remediation_evidence_is_mapped_to_the_correct_tasks

  DT-439:
    requirement: Validate required and exact schemas, identifiers, uniqueness, and rejection behavior.
    coverage:
      positive: Valid canonical synthetic schemas and exact final-output schemas are accepted.
      negative: Missing, reordered, duplicate, extra, case-mismatched, or incorrectly typed columns and invalid keys are rejected.
      boundary: Exact column order and case-sensitive names are enforced; header-only submissions fail row-count validation.
    nodes:
      - tests/test_schema_assertions.py::test_assert_required_columns_pass
      - tests/test_schema_assertions.py::test_assert_required_columns_fail
      - tests/test_final_submission_task1.py::test_exact_columns_required
      - tests/test_final_submission_task1.py::test_case_mismatched_columns_are_rejected
      - tests/test_final_submission_task1.py::test_header_only_submission_is_rejected
      - tests/test_final_submission_task1.py::test_row_and_id_integrity
      - tests/test_final_submission_task1.py::test_probability_range_rejects_invalid_values
      - tests/test_final_submission_task2a.py::test_task2a_exact_filename_and_schema
      - tests/test_final_submission_task2b.py::test_task2b_exact_filename_and_columns
      - tests/test_final_submission_contract.py::test_strict_csv_preflight_rejects_bad_csv
      - tests/test_data_quality.py::test_dt039_semantic_type_validation

  DT-440:
    requirement: Verify join cardinality, composite keys, left-row preservation, and fail-closed lookup behavior.
    coverage:
      positive: Official composite route keys join one-to-one while preserving left identity and order.
      negative: Duplicate right keys, unmatched rows, and destination mismatches fail closed.
      boundary: Calendar many-to-one joins reject duplicate or absent requested dates.
    nodes:
      - tests/test_task1_labels.py::test_join_orders_to_route_legs_uses_official_composite_key_and_left_join
      - tests/test_task1_labels.py::test_join_orders_to_route_legs_raises_when_route_key_is_duplicated
      - tests/test_task1_inference.py::test_unmatched_test_order_fails
      - tests/test_task1_inference.py::test_destination_mismatch_fails
      - tests/test_task2a_history.py::test_calendar_duplicate_or_unmatched_date_is_a_blocker

  DT-441:
    requirement: Test clock parsing, chronology, early-window waiting, strict close boundaries, and ISO week rollover.
    coverage:
      positive: Valid daytime, midnight, and requested-date calendar cases resolve deterministically.
      negative: Invalid clocks, impossible chronology, and February 29 in a non-leap year are rejected.
      boundary: Leap-day midnight transitions, equality at window close, and ISO week-year rollover resolve deterministically.
    nodes:
      - tests/test_task1_labels.py::test_dt062_parse_clock_rejects_invalid_values
      - tests/test_task1_labels.py::test_dt063_resolve_route_actual_datetimes_midnight_rollover
      - tests/test_task1_labels.py::test_dt063_leap_day_midnight_transitions
      - tests/test_task1_labels.py::test_dt062_invalid_non_leap_february_29_rejected
      - tests/test_task1_labels.py::test_dt063_impossible_chronology_raises_on_travel_conflict
      - tests/test_task1_labels.py::test_dt064_service_start_uses_max_of_arrival_and_window_open
      - tests/test_task1_labels.py::test_dt066_late_flag_strict_boundary
      - tests/test_task2a_history.py::test_iso_year_week_53_and_same_week_number_across_years_use_calendar

  DT-442:
    requirement: Protect canonical service-minute and strict-lateness label generation.
    coverage:
      positive: Service and lateness labels are generated from eligible dispatched route events.
      negative: Negative service duration, missing actual times, and inconsistent labels are rejected.
      boundary: Early waiting is excluded, exact close is on time, and one minute after close is late.
    nodes:
      - tests/test_task1_labels.py::test_dt065_service_minutes_excludes_early_waiting_official_example
      - tests/test_task1_labels.py::test_dt065_service_minutes_negative_raises
      - tests/test_task1_labels.py::test_dt066_late_flag_strict_boundary
