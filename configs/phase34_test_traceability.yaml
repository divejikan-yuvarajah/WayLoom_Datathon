      - tests/test_task1_inference.py::test_train_test_feature_schema_and_order
      - tests/test_task1_inference.py::test_forbidden_features_absent

  DT-445:
    requirement: Test Task 2A aggregation across both sources using one order once and requested-date ISO weeks.
    coverage:
      positive: Attempted, deferred, and not-run demand from both sources is retained and reconciled.
      negative: Duplicate delivery IDs, invalid volume, non-Fresh chilled contradictions, and missing calendar dates fail.
      boundary: ISO week 53/year rollover and zero-volume/interior-zero weeks are handled explicitly.
    nodes:
      - tests/test_task2a_history.py::test_build_history_retains_both_sources_statuses_and_requested_dates
      - tests/test_task2a_history.py::test_duplicate_ids_across_sources_are_a_hard_blocker
      - tests/test_task2a_history.py::test_not_run_with_blank_operational_fields_is_demand
      - tests/test_task2a_history.py::test_iso_year_week_53_and_same_week_number_across_years_use_calendar
      - tests/test_task2a_history.py::test_fresh_chilled_and_ambient_are_separated_and_nonfresh_contradictions_block
      - tests/test_task2a_history.py::test_invalid_volume_is_rejected
      - tests/test_task2a_history.py::test_confirmed_zero_interior_week_is_filled_but_boundary_is_not

  DT-446:
    requirement: Test Task 2A forecast identity, finiteness, nonnegativity, structural zeros, and chilled-total relation.
    coverage:
      positive: Deterministic forecasts preserve row IDs and satisfy all final volume constraints.
      negative: NaN, missing IDs, Style chilled, and chilled above total are rejected or frozen-postprocessed.
      boundary: Zero totals, exact chilled-equals-total, and the ten-horizon official grid remain valid.
    nodes:
      - tests/test_task2a_final_inference.py::test_test_grid_origin_calendar_and_horizons_are_exact
      - tests/test_task2a_final_inference.py::test_postprocessing_structural_zero_clipping_and_capping
      - tests/test_task2a_final_inference.py::test_frozen_ensemble_inference_is_direct_and_deterministic
      - tests/test_task2a_submission.py::test_mapping_is_by_row_id_and_atomic_export_round_trips
      - tests/test_task2a_submission.py::test_template_and_prediction_integrity_fail_closed

  DT-447:
    requirement: Test Task 2B availability, refrigeration, access, depot, grouping, and capacity compatibility rules.
    coverage:
      positive: Available compatible reefer vans and reefer vehicles carrying ambient demand are accepted.
      negative: Workshop, dry-for-chilled, truck-for-van-only, wrong-depot, mixed-group, and over-capacity cases fail.
      boundary: Repeated outlet IDs are allowed while unique order_ref remains the allocation key.
    nodes:
      - tests/test_task2b_scenario.py::test_fleet_references_and_s1_availability_are_fail_closed
      - tests/test_task2b_compatibility.py::test_cross_product_rules_and_reasons_are_complete
      - tests/test_task2b_allocation_validator.py::test_each_official_hard_rule_mutation_fails
      - tests/test_task2b_allocation_validator.py::test_valid_allocation_is_deterministic_read_only_and_allows_repeated_outlet_and_trip2_only

  DT-448:
    requirement: Test exact Task 2B trip arithmetic, no return leg, trip caps, and per-vehicle time budgets.
    coverage:
      positive: Official 101/112-minute examples and valid two-trip schedules pass.
      negative: Missing references, third trips, and budgets one minute over the limit fail.
      boundary: One-stop inter-stop time is zero; Fresh 270 and Style plus Tech 480 are inclusive limits.
    nodes:
      - tests/test_task2b_trip_time.py::test_official_examples_and_no_return
      - tests/test_task2b_trip_time.py::test_count_orders_and_reference_fail_closed
