      - tests/test_task2b_allocation_validator.py::test_identity_decision_and_served_field_mutations_fail

  DT-449:
    requirement: Test optimizer output coverage, whole orders, trip domains, hard feasibility, and deterministic proof status.
    coverage:
      positive: Synthetic optimization produces deterministic, independently feasible complete allocations.
      negative: Duplicate/missing orders, split/group violations, infeasible capacity, and unproven final status fail.
      boundary: Exactly two trips and exact capacity/time limits pass while the next increment fails.
    nodes:
