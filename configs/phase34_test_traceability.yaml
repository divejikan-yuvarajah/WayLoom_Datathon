      - tests/test_task1_labels.py::test_dt067_validate_task1_labels_rejects_missing_datetime_or_late_flag

  DT-443:
    requirement: Protect stable feature schemas and exclude outcome or future-information leakage.
    coverage:
      positive: Canonical train/test features retain identical ordered schemas.
      negative: Direct forbidden fields and renamed forbidden lineage are rejected.
      boundary: Same-day/future records cannot influence prior features and shuffled history is deterministic.
    nodes:
      - tests/test_task1_features.py::test_full_build_train_test_parity_and_forbidden_excluded
      - tests/test_task1_feature_leakage.py::test_dt121_direct_forbidden_column_rejected
      - tests/test_task1_feature_leakage.py::test_dt121_lineage_rejects_renamed_leakage
      - tests/test_task1_historical_features.py::test_dt119_current_same_day_future_excluded
      - tests/test_task1_historical_features.py::test_dt119_deterministic_under_shuffle
      - tests/test_task2a_features.py::test_future_mutation_cannot_change_prior_origin_features

  DT-444:
    requirement: Test saved-model Task 1 inference, prediction bounds, feature coherence, identity, and order.
    coverage:
      positive: Reloaded bundles produce finite repeatable service and bounded late probabilities.
      negative: Missing models, corrupt feature schemas, and forbidden features fail without retraining.
      boundary: Unseen categories use frozen preprocessing and arbitrary official ID order is restored exactly.
    nodes:
      - tests/test_task1_inference.py::test_missing_model_fails_without_training
      - tests/test_task1_inference.py::test_unseen_test_category_uses_frozen_preprocessing
      - tests/test_task1_inference.py::test_service_output_length_finite_and_repeatable
      - tests/test_task1_inference.py::test_late_probability_bounds_and_identity
