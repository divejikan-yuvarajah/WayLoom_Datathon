      - tests/test_task2b_optimizer_constraints.py::test_combined_weight_and_volume_and_group_separation
      - tests/test_task2b_lexicographic_solver.py::test_all_stages_proven_and_deterministic
      - tests/test_task2b_lexicographic_solver.py::test_final_stage_rejects_nonoptimal_status
